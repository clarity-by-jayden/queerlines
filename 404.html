<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ff2d8d">
  <title>Page not found | Queer Between the Lines</title>
  <style>
    :root {
      --ink: #090909;
      --cream: #fff7e8;
      --acid: #e8ff1f;
      --pink: #ff2d8d;
      --blue: #4757ff;
      --orange: #ff643f;
      --green: #00b85a;
      --purple: #8f55ff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100svh;
      overflow-x: hidden;
      background: var(--cream);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100svh;
      padding: clamp(22px, 4vw, 58px);
      overflow: hidden;
    }

    .rainbow {
      position: absolute;
      z-index: -1;
      top: clamp(28px, 5vw, 72px);
      right: clamp(-165px, -10vw, -80px);
      width: clamp(360px, 38vw, 620px);
      height: clamp(54px, 6vw, 92px);
      transform: rotate(42deg);
      border: 4px solid var(--ink);
      background: linear-gradient(
        to bottom,
        var(--pink) 0 16.66%,
        var(--orange) 16.66% 33.32%,
        var(--acid) 33.32% 49.98%,
        var(--green) 49.98% 66.64%,
        var(--blue) 66.64% 83.3%,
        var(--purple) 83.3% 100%
      );
    }

    .brand {
      max-width: 15ch;
      padding-right: 100px;
      font-size: clamp(14px, 1.6vw, 22px);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .content {
      align-self: center;
      display: grid;
      grid-template-columns: minmax(270px, .8fr) minmax(0, 1.2fr);
      align-items: center;
      gap: clamp(30px, 7vw, 110px);
      width: min(1180px, 100%);
      margin: clamp(38px, 7vh, 100px) auto;
    }

    .number-wrap {
      position: relative;
      justify-self: center;
      width: min(100%, 470px);
      aspect-ratio: 4 / 5;
      display: grid;
      place-items: center;
      border: clamp(5px, .55vw, 8px) solid var(--ink);
      background: var(--blue);
      box-shadow: clamp(14px, 2vw, 28px) clamp(16px, 2.2vw, 32px) 0 var(--pink);
      transform: rotate(-2deg);
    }

    .number-wrap::before {
      content: "";
      position: absolute;
      inset: 6%;
      border: clamp(3px, .35vw, 5px) solid var(--ink);
      background: var(--acid);
      transform: rotate(3deg);
    }

    .number {
      position: relative;
      z-index: 1;
      margin: 0;
      font-family: Impact, "Arial Black", Arial, sans-serif;
      font-size: clamp(120px, 20vw, 300px);
      line-height: .78;
      letter-spacing: -.04em;
      color: var(--ink);
    }

    .copy { position: relative; }

    .label {
      display: inline-block;
      margin: 0 0 clamp(20px, 3vw, 36px);
      padding: 9px 13px;
      border: 3px solid var(--ink);
      background: var(--acid);
      box-shadow: 5px 5px 0 var(--pink);
      color: var(--ink);
      font-size: clamp(12px, 1.3vw, 17px);
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 8ch;
      margin: 0;
      font-family: Impact, "Arial Black", Arial, sans-serif;
      font-size: clamp(72px, 10vw, 150px);
      font-weight: 900;
      line-height: .82;
      letter-spacing: -.035em;
      text-transform: uppercase;
    }

    .message {
      max-width: 34rem;
      margin: clamp(24px, 4vw, 42px) 0;
      font-size: clamp(18px, 2vw, 27px);
      font-weight: 700;
      line-height: 1.35;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      padding: 17px 22px;
      border: 4px solid var(--ink);
      background: var(--pink);
      color: var(--ink);
      box-shadow: 7px 8px 0 var(--ink);
      font-size: clamp(14px, 1.4vw, 18px);
      font-weight: 900;
      letter-spacing: .11em;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .button:hover,
    .button:focus-visible {
      transform: translate(4px, 4px);
      box-shadow: 3px 4px 0 var(--ink);
    }

    .button:focus-visible {
      outline: 4px solid var(--blue);
      outline-offset: 5px;
    }

    .arrow { font-size: 1.35em; line-height: 1; }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding-top: 18px;
      border-top: 5px solid var(--ink);
      font-size: clamp(12px, 1.3vw, 17px);
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    @media (max-width: 760px) {
      .page { padding: 24px 22px 28px; }
      .content {
        grid-template-columns: 1fr;
        gap: 42px;
        margin: 48px auto 56px;
      }
      .number-wrap { width: min(67vw, 330px); }
      .number { font-size: clamp(120px, 43vw, 210px); }
      h1 { font-size: clamp(68px, 19vw, 110px); }
      footer { align-items: end; }
      footer span:last-child { text-align: right; }
    }

    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
    }

    @media (prefers-color-scheme: dark) {
      :root { --cream: #111218; }
      body { color: #fff7e8; }
      .brand,
      h1,
      .message,
      footer { color: #fff7e8; }
      footer { border-color: #fff7e8; }
      .button { color: var(--ink); }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="rainbow" aria-hidden="true"></div>

    <header class="brand">Queer Between the Lines</header>

    <section class="content" aria-labelledby="page-title">
      <div class="number-wrap" aria-hidden="true">
        <p class="number">404</p>
      </div>

      <div class="copy">
        <p class="label">Plot twist</p>
        <h1 id="page-title">Wrong page.</h1>
        <p class="message">
          This page has wandered off between the lines. Let’s get you back to the books.
        </p>
        <a class="button" href="/">
          Back to the book club
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </section>

    <footer>
      <span>Turn pages together</span>
      <span>Stories beyond the straight and narrow</span>
    </footer>
  </main>
</body>
</html>
