<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8ff1f">
  <title>Author Spotlight: Melissa Mogollon | Queer Between the Lines</title>
  <style>
    :root {
      --acid: #e8ff1f;
      --ink: #090909;
      --pink: #ff2d8d;
      --blue: #4757ff;
      --orange: #ff643f;
      --cream: #fff7e8;
      --green: #00b85a;
      --purple: #8f55ff;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--acid);
      color: var(--ink);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .poster {
      position: relative;
      isolation: isolate;
      min-height: 100svh;
      width: 100%;
      padding: clamp(24px, 5vw, 76px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(24px, 4vw, 56px);
      overflow: hidden;
      background: var(--acid);
    }

    .rainbow {
      position: absolute;
      z-index: -1;
      top: clamp(20px, 4vw, 56px);
      right: clamp(-145px, -9vw, -72px);
      width: clamp(340px, 36vw, 600px);
      height: clamp(50px, 6vw, 92px);
      transform: rotate(42deg);
      border: 4px solid var(--ink);
      background: linear-gradient(to bottom,
        var(--pink) 0 16.66%, var(--orange) 16.66% 33.32%,
        var(--acid) 33.32% 49.98%, var(--green) 49.98% 66.64%,
        var(--blue) 66.64% 83.3%, var(--purple) 83.3% 100%);
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding-right: clamp(0px, 16vw, 240px);
    }

    .club-name, .issue, .eyebrow, .book-name, .footer {
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .11em;
    }

    .club-name {
      max-width: 14ch;
      font-size: clamp(15px, 1.8vw, 26px);
      line-height: 1.05;
    }

    .issue {
      flex: 0 0 auto;
      padding: 10px 12px;
      border: 3px solid var(--ink);
      background: var(--pink);
      box-shadow: 5px 5px 0 var(--ink);
      font-size: clamp(11px, 1.2vw, 17px);
    }

    .main {
      align-self: center;
      display: grid;
      grid-template-columns: minmax(0, .86fr) minmax(280px, .72fr);
      align-items: center;
      gap: clamp(30px, 7vw, 110px);
    }

    .copy { position: relative; z-index: 2; }

    .eyebrow {
      display: inline-block;
      margin: 0 0 clamp(18px, 3vw, 34px);
      padding: 10px 14px;
      border: 3px solid var(--ink);
      background: var(--cream);
      box-shadow: 6px 6px 0 var(--pink);
      font-size: clamp(13px, 1.6vw, 22px);
    }

    h1 {
      margin: 0;
      font-family: Impact, "Arial Black", Arial, sans-serif;
      font-size: clamp(72px, 12vw, 180px);
      font-weight: 900;
      line-height: .8;
      letter-spacing: -.045em;
      text-transform: uppercase;
    }

    h1 span { display: block; }

    .book-name {
      display: inline-block;
      margin: clamp(24px, 4vw, 48px) 0 0;
      padding: 12px 16px;
      border: 3px solid var(--ink);
      background: var(--blue);
      color: #fff;
      box-shadow: 7px 7px 0 var(--orange);
      font-size: clamp(15px, 2vw, 28px);
    }

    .portrait-frame {
      position: relative;
      justify-self: center;
      width: min(100%, 520px);
      aspect-ratio: 4 / 5;
      transform: rotate(2deg);
      border: clamp(4px, .45vw, 7px) solid var(--ink);
      overflow: hidden;
      background:
        repeating-linear-gradient(to bottom,
          transparent 0, transparent 34px,
          rgba(9,9,9,.15) 35px, rgba(9,9,9,.15) 36px),
        var(--cream);
      box-shadow: 14px 16px 0 var(--pink);
    }

    .portrait-frame::before {
      content: "";
      position: absolute;
      inset: 5% -7% -5% 7%;
      z-index: -1;
      background: var(--blue);
      border: 5px solid var(--ink);
    }

    .portrait {
      position: absolute;
      inset: 3% 2% 0;
      width: 96%;
      height: 97%;
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(7px 8px 0 rgba(9,9,9,.16));
    }

    .sticker {
      position: absolute;
      right: -8%;
      bottom: 7%;
      width: clamp(112px, 13vw, 190px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      padding: 12px;
      border: clamp(4px, .5vw, 7px) solid var(--ink);
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 9px 10px 0 var(--ink);
      font-size: clamp(14px, 1.8vw, 26px);
      font-weight: 900;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
      transform: rotate(9deg);
    }

    .footer {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      padding-top: clamp(14px, 2vw, 28px);
      border-top: clamp(4px, .45vw, 7px) solid var(--ink);
      font-size: clamp(12px, 1.5vw, 21px);
    }

    .tagline { font-size: clamp(16px, 2.4vw, 34px); }

    @media (max-width: 720px) {
      .poster { padding: 24px 22px 28px; gap: 22px; }
      .masthead { padding-right: 90px; }
      .main {
        grid-template-columns: minmax(0, .82fr) minmax(150px, .9fr);
        gap: 18px;
      }
      h1 { font-size: clamp(62px, 18vw, 100px); }
      .portrait-frame { width: min(100%, 330px); }
      .footer { align-items: center; }
      .footer span:last-child { text-align: right; }
    }

    @media (max-width: 460px) {
      .poster { min-height: 100svh; }
      .main { grid-template-columns: 1fr; align-content: center; }
      .copy { margin-bottom: -8px; }
      h1 { font-size: clamp(74px, 23vw, 104px); }
      .portrait-frame { width: min(68vw, 285px); }
      .book-name { margin-top: 18px; }
    }

    @media print {
      @page { margin: 0; }
      .poster { min-height: 100vh; }
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="Author spotlight on Melissa Mogollon, author of Oye">
    <div class="rainbow" aria-hidden="true"></div>

    <header class="masthead">
      <div class="club-name">Queer Between the Lines</div>
      <div class="issue">Book 006</div>
    </header>

    <section class="main">
      <div class="copy">
        <p class="eyebrow">Author spotlight</p>
        <h1><span>Melissa</span><span>Mogollon</span></h1>
        <p class="book-name">Author of Oye</p>
      </div>

      <div class="portrait-frame">
        <img
          class="portrait"
          src="https://si4io.mjt.lu/img2/si4io/eec9f87f-21c0-4e52-9067-284780096695/content"
          alt="Melissa Mogollon, author of Oye"
        >
        <div class="sticker">Meet the author</div>
      </div>
    </section>

    <footer class="footer">
      <span class="tagline">Turn pages together.</span>
      <span>Queer book club</span>
    </footer>
  </main>
</body>
</html>
