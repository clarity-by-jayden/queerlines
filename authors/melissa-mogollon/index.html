<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8ff1f">
  <title>Author Spotlight: Melissa Mogollon | Queer Between the Lines</title>
  <style>
    :root {
      --acid: #e8ff1f;
      --ink: #090909;
      --pink: #ff2d8d;
      --blue: #4757ff;
      --orange: #ff643f;
      --cream: #fff7e8;
      --green: #00b85a;
      --purple: #8f55ff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--acid);
      color: var(--ink);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .poster {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100svh;
      padding: clamp(22px, 4.5vw, 68px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(18px, 3vw, 42px);
      overflow: hidden;
      background: var(--acid);
    }

    .rainbow {
      position: absolute;
      z-index: -1;
      top: clamp(18px, 4vw, 52px);
      right: clamp(-140px, -9vw, -68px);
      width: clamp(320px, 36vw, 560px);
      height: clamp(48px, 6vw, 88px);
      transform: rotate(42deg);
      border: 4px solid var(--ink);
      background: linear-gradient(to bottom,
        var(--pink) 0 16.66%, var(--orange) 16.66% 33.32%,
        var(--acid) 33.32% 49.98%, var(--green) 49.98% 66.64%,
        var(--blue) 66.64% 83.3%, var(--purple) 83.3% 100%);
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding-right: clamp(88px, 16vw, 230px);
    }

    .club-name, .issue, .eyebrow, .book-name, .footer {
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .11em;
    }

    .club-name {
      max-width: 14ch;
      font-size: clamp(15px, 1.7vw, 25px);
      line-height: 1.05;
    }

    .issue {
      flex: 0 0 auto;
      padding: 9px 12px;
      border: 3px solid var(--ink);
      background: var(--pink);
      box-shadow: 5px 5px 0 var(--ink);
      font-size: clamp(11px, 1.2vw, 17px);
    }

    .main {
      align-self: center;
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(230px, .72fr);
      align-items: center;
      gap: clamp(24px, 6vw, 90px);
    }

    .copy { position: relative; z-index: 2; }

    .eyebrow {
      display: inline-block;
      margin: 0 0 clamp(16px, 2.5vw, 30px);
      padding: 9px 13px;
      border: 3px solid var(--ink);
      background: var(--cream);
      box-shadow: 6px 6px 0 var(--pink);
      font-size: clamp(12px, 1.5vw, 21px);
    }

    h1 {
      margin: 0;
      font-family: Impact, "Arial Black", Arial, sans-serif;
      font-size: clamp(64px, 11vw, 164px);
      font-weight: 900;
      line-height: .8;
      letter-spacing: -.045em;
      text-transform: uppercase;
    }

    h1 span { display: block; }

    .book-name {
      display: inline-block;
      margin: clamp(20px, 3vw, 40px) 0 0;
      padding: 11px 15px;
      border: 3px solid var(--ink);
      background: var(--blue);
      color: #fff;
      box-shadow: 7px 7px 0 var(--orange);
      font-size: clamp(14px, 1.8vw, 26px);
    }

    .portrait-frame {
      position: relative;
      justify-self: center;
      width: min(100%, 480px);
      aspect-ratio: 4 / 5;
      transform: rotate(2deg);
      border: clamp(4px, .45vw, 7px) solid var(--ink);
      overflow: visible;
      background:
        repeating-linear-gradient(to bottom,
          transparent 0, transparent 34px,
          rgba(9,9,9,.15) 35px, rgba(9,9,9,.15) 36px),
        var(--cream);
      box-shadow: 12px 14px 0 var(--pink);
    }

    .portrait-frame::before {
      content: "";
      position: absolute;
      inset: 5% -7% -5% 7%;
      z-index: -1;
      background: var(--blue);
      border: 5px solid var(--ink);
    }

    .portrait {
      position: absolute;
      inset: 3% 2% 0;
      width: 96%;
      height: 97%;
      object-fit: contain;
      object-position: center bottom;
      clip-path: inset(0);
      filter: drop-shadow(7px 8px 0 rgba(9,9,9,.16));
    }

    .sticker {
      position: absolute;
      right: -7%;
      bottom: 6%;
      width: clamp(92px, 11vw, 158px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      padding: 11px;
      border: clamp(4px, .5vw, 7px) solid var(--ink);
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 8px 9px 0 var(--ink);
      font-size: clamp(12px, 1.45vw, 21px);
      font-weight: 900;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
      transform: rotate(9deg);
    }

    .footer {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 22px;
      padding-top: clamp(12px, 1.8vw, 24px);
      border-top: clamp(4px, .45vw, 7px) solid var(--ink);
      font-size: clamp(11px, 1.35vw, 19px);
    }

    .tagline { font-size: clamp(15px, 2.2vw, 31px); }

    @media (max-width: 720px) {
      .poster { padding: 23px 20px 26px; gap: 20px; }
      .masthead { padding-right: 88px; }
      .main {
        align-self: stretch;
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        align-content: center;
        gap: 0;
        padding: 3svh 0 1svh;
      }
      .copy { z-index: 3; }
      .eyebrow { margin-bottom: 18px; }
      h1 { font-size: clamp(68px, 20vw, 116px); }
      .book-name { margin-top: 20px; }
      .portrait-frame {
        z-index: 2;
        align-self: end;
        justify-self: end;
        width: min(68vw, 350px);
        margin-top: -15vw;
        margin-right: 2vw;
      }
      .sticker { right: -2%; bottom: 4%; }
      .footer { align-items: center; }
      .footer span:last-child { text-align: right; }
    }

    @media (max-height: 650px) {
      .poster { padding-top: 18px; padding-bottom: 18px; gap: 14px; }
      .main { gap: clamp(16px, 4vw, 48px); }
      .portrait-frame { width: min(100%, 330px); }
      .eyebrow { margin-bottom: 14px; }
      .book-name { margin-top: 16px; }
      .footer { padding-top: 10px; }
    }

    @media (max-width: 720px) and (max-height: 650px) {
      .main {
        grid-template-columns: minmax(0, .9fr) minmax(140px, 1fr);
        grid-template-rows: 1fr;
        gap: 14px;
        padding: 0;
      }
      h1 { font-size: clamp(48px, 15vw, 78px); }
      .portrait-frame {
        align-self: center;
        width: min(100%, 230px);
        margin: 0;
      }
    }

    @media print {
      @page { margin: 0; }
      .poster { width: 100vw; }
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="Author spotlight on Melissa Mogollon, author of Oye">
    <div class="rainbow" aria-hidden="true"></div>

    <header class="masthead">
      <div class="club-name">Queer Between the Lines</div>
      <div class="issue">Book 006</div>
    </header>

    <section class="main">
      <div class="copy">
        <p class="eyebrow">Author spotlight</p>
        <h1><span>Melissa</span><span>Mogollon</span></h1>
        <p class="book-name">Author of Oye</p>
      </div>

      <div class="portrait-frame">
        <img
          class="portrait"
          src="https://si4io.mjt.lu/img2/si4io/eec9f87f-21c0-4e52-9067-284780096695/content"
          alt="Melissa Mogollon, author of Oye"
        >
        <div class="sticker">Meet the author</div>
      </div>
    </section>

    <footer class="footer">
      <span class="tagline">Turn pages together.</span>
      <span>Queer book club</span>
    </footer>
  </main>
</body>
</html>
