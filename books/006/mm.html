<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e8ff1f">
  <title>Melissa Mogollon is joining us | Queer Between the Lines</title>
  <style>
    :root{--acid:#e8ff1f;--ink:#090909;--pink:#ff2d8d;--blue:#4757ff;--orange:#ff643f;--cream:#fff7e8;--green:#00b85a;--purple:#8f55ff}
    *{box-sizing:border-box}
    html{background:var(--acid)}
    body{margin:0;min-height:100vh;background:var(--acid);color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
    .page{position:relative;isolation:isolate;min-height:100vh;padding:clamp(22px,4vw,64px);display:flex;flex-direction:column;overflow:hidden}
    .rainbow{position:absolute;z-index:-1;top:clamp(30px,6vw,80px);right:clamp(-180px,-10vw,-80px);width:clamp(360px,42vw,620px);height:clamp(54px,7vw,94px);transform:rotate(42deg);border:4px solid var(--ink);background:linear-gradient(to bottom,var(--pink) 0 16.66%,var(--orange) 16.66% 33.32%,var(--acid) 33.32% 49.98%,var(--green) 49.98% 66.64%,var(--blue) 66.64% 83.3%,var(--purple) 83.3% 100%)}
    header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-right:clamp(100px,18vw,260px)}
    .club,.issue,.eyebrow,.date,footer{font-weight:900;text-transform:uppercase;letter-spacing:.11em}
    .club{max-width:14ch;font-size:clamp(15px,1.8vw,26px);line-height:1.05}
    .issue{flex:none;padding:9px 12px;border:3px solid var(--ink);background:var(--pink);box-shadow:5px 5px 0 var(--ink);font-size:clamp(11px,1.2vw,17px)}
    .hero{width:min(1180px,100%);margin:auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(280px,.75fr);align-items:center;gap:clamp(36px,7vw,110px);padding:clamp(54px,8vh,100px) 0}
    .copy{position:relative;z-index:2}
    .eyebrow{display:inline-block;margin:0 0 clamp(20px,3vw,34px);padding:9px 13px;border:3px solid var(--ink);background:var(--cream);box-shadow:6px 6px 0 var(--pink);font-size:clamp(12px,1.4vw,20px)}
    h1{margin:0;font-family:Impact,"Arial Black",Arial,sans-serif;font-size:clamp(74px,10vw,150px);font-weight:900;line-height:.88;letter-spacing:-.035em;text-transform:uppercase}
    h1 span{display:block}
    h1 .joining{margin-top:.38em;color:var(--blue);font-size:.52em;line-height:1;letter-spacing:-.025em;white-space:nowrap}
    .date{display:inline-block;margin:clamp(24px,3vw,40px) 0 0;padding:11px 15px;border:3px solid var(--ink);background:var(--blue);color:#fff;box-shadow:7px 7px 0 var(--orange);font-size:clamp(16px,1.8vw,26px)}
    .visual{position:relative;justify-self:center;width:min(100%,450px);padding-bottom:58px;transform:rotate(1.5deg)}
    .portrait-frame{position:relative;width:100%;aspect-ratio:4/5;border:6px solid var(--ink);background:repeating-linear-gradient(to bottom,transparent 0,transparent 34px,rgba(9,9,9,.14) 35px,rgba(9,9,9,.14) 36px),var(--cream);box-shadow:13px 15px 0 var(--pink)}
    .portrait-frame:before{content:"";position:absolute;inset:5% -7% -5% 7%;z-index:-1;border:5px solid var(--ink);background:var(--blue)}
    .portrait{position:absolute;inset:3% 2% 0;width:96%;height:97%;object-fit:contain;object-position:center bottom;filter:drop-shadow(7px 8px 0 rgba(9,9,9,.16))}
    .book{position:absolute;right:-5%;bottom:0;width:40%;border:4px solid var(--ink);box-shadow:8px 9px 0 var(--orange);transform:rotate(7deg)}
    .sticker{position:absolute;left:-10%;bottom:6%;width:clamp(100px,10vw,150px);aspect-ratio:1;display:grid;place-items:center;padding:12px;border:5px solid var(--ink);border-radius:50%;background:var(--orange);box-shadow:8px 9px 0 var(--ink);font-size:clamp(13px,1.3vw,20px);font-weight:900;line-height:1;text-align:center;text-transform:uppercase;transform:rotate(-10deg)}
    footer{display:flex;align-items:end;justify-content:space-between;gap:22px;padding-top:18px;border-top:5px solid var(--ink);font-size:clamp(11px,1.2vw,18px)}
    footer .tagline{font-size:clamp(16px,2vw,29px)}

    @media(max-width:720px){
      .page{min-height:auto;padding:22px 20px 26px}
      header{padding-right:86px}
      .rainbow{top:26px;right:-145px;width:340px;height:52px}
      .hero{display:flex;flex-direction:column;align-items:stretch;gap:38px;padding:64px 0 52px}
      .copy{display:flex;flex-direction:column;align-items:flex-start}
      h1{font-size:clamp(58px,15vw,82px);line-height:.88}
      h1 .joining{margin-top:.42em;font-size:.5em;line-height:1}
      .visual{width:min(72vw,330px);margin:0 auto;padding-bottom:48px}
      .sticker{left:-12%;width:105px;font-size:13px}
      footer{align-items:center}
      footer span:last-child{text-align:right}
    }

    @media(max-width:390px){
      .page{padding-left:16px;padding-right:16px}
      .hero{padding-top:54px}
      h1{font-size:14.5vw}
      .visual{width:min(74vw,290px)}
      .sticker{left:-10%;width:92px;font-size:11px}
    }
  </style>
</head>
<body>
  <main class="page" aria-label="Melissa Mogollon is joining the Queer Between the Lines meet-up on 9 September">
    <div class="rainbow" aria-hidden="true"></div>
    <header><div class="club">Queer Between the Lines</div><div class="issue">Book 006</div></header>
    <section class="hero">
      <div class="copy">
        <p class="eyebrow">Special guest</p>
        <h1><span>Melissa</span><span>Mogollon</span><span class="joining">is joining us!</span></h1>
        <p class="date">9 September</p>
      </div>
      <div class="visual">
        <div class="portrait-frame"><img class="portrait" src="https://si4io.mjt.lu/img2/si4io/eec9f87f-21c0-4e52-9067-284780096695/content" alt="Melissa Mogollon, author of Oye"></div>
        <img class="book" src="https://si4io.mjt.lu/img2/si4io/bab81f13-cc00-4f13-a5ad-b3e2816dc524/content" alt="Oye by Melissa Mogollon">
        <div class="sticker">Meet the author</div>
      </div>
    </section>
    <footer><span class="tagline">Turn pages together.</span><span>Queer book club</span></footer>
  </main>
</body>
</html>
