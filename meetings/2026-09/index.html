<script>
  (function () {
    // Canonical event time: 2026-09-09 20:00 in Europe/London (UK time)
    const eventUtc = new Date("2026-09-09T19:00:00.000Z");
    const localTimeEl = document.getElementById("qbtl-local-time");

    if (!localTimeEl || Number.isNaN(eventUtc.getTime())) return;

    try {
      const local = new Intl.DateTimeFormat(undefined, {
        weekday: "short",
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
        timeZoneName: "short"
      }).format(eventUtc);
      localTimeEl.textContent = local;
    } catch (e) {
      // Fallback: just show device-local time without timezone label
      localTimeEl.textContent = eventUtc.toLocaleString();
    }
  }());
</script>
